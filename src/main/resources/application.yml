server:
  port: ${PORT:8081}

spring:
  application:
    name: auth-service
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  sql:
    init:
      mode: never
      schema-locations: classpath:schema.sql

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/horas_db?sslmode=disable}
    username: ${SPRING_DATASOURCE_USERNAME:horas_user}
    password: ${SPRING_DATASOURCE_PASSWORD:horas_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  # Merged Cloud Configuration
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY:noop}
        secret-key: ${AWS_SECRET_KEY:noop}
      region:
        static: ${AWS_REGION:us-east-1}
      s3:
        enabled: true
        endpoint: ${AWS_S3_ENDPOINT:}
        path-style-access-enabled: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

  # AWS Config for your CUSTOM CODE (if using @Value("${cloud.aws.s3.bucket-name}"))
cloud:
  aws:
    s3:
      bucket-name: ${AWS_S3_BUCKET_NAME:local-bucket}
      folder-name: ${AWS_S3_FOLDER_NAME:uploads}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    enabled: true

url:
  front-end: ${URL_FRONT_END}

socketio:
  host: 0.0.0.0
  port: ${SOCKET_IO_PORT:9095}
  origin: ${url.front-end}

codes:
  admin: ${CODE_ADMIN}
  especialista: ${CODE_EXPERT}

google:
  client-id: ${GOOGLE_CLIENT_ID:your-google-id}

telegram:
  bot:
    username: ${TELEGRAM_CHAT_ID}
    token: ${TELEGRAM_BOT_TOKEN}