server:
  port: ${PORT:8081}
spring:
  application:
    name: auth-service
  # Certifique-se de que a execução do script está habilitada
  sql:
    init:
      schema-locations: classpath:schema.sql
      mode: always
  datasource:
    url:  ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: true

    properties:
      hibernate:
        format_sql: true

  # rabbitmq
  rabbitmq:
    host:  ${SPRING_RABBITMQ_HOST}   # Se estiver a correr o RabbitMQ localmente
    port: ${SPRING_RABBITMQ_PORT}           # Porta padrão do RabbitMQ
    username:  ${SPRING_RABBITMQ_USERNAME}   # Usuário padrão
    password: ${SPRING_RABBITMQ_PASSWORD}   # Password padrão


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,beans
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}  # 24h em ms

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    filter: true
    display-request-duration: true

logging:
  level:
    org:
      hibernate:
        ORM:
          jdbc:
            bind: trace
      springframework:
        security: DEBUG
    flywaydb: DEBUG
    com:
      registo:
        horas_estagio: DEBUG
    org.flywaydb: DEBUG
  file:
    name: logs/app.log

url:
  front-end: ${FRONT_END}   # Onde os utilizadores acedem

socketio:
  host: 0.0.0.0                    # O servidor ouve em todas as interfaces
  port: ${SOCKET_IO_PORT:9095}
  origin: ${url.front-end}


codes:
  admin: ${CODE_ADMIN}
  especialista: ${CODE_EXPERT}

google:
  client-id: ${GOOGLE_CLIENT_ID}

telegram:
  bot:
    username: ${TELEGRAM_BOT_USERNAME:TREG_Alerta} # Adicionado aqui!
    token:
      anetoBot: ${TELEGRAM_BOT_TOKEN}