server:
  port: ${PORT:8081}

spring:
  application:
    name: auth-service

  sql:
    init:
      schema-locations: classpath:schema.sql
      mode: always
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: true

  rabbitmq:
    host:  ${SPRING_RABBITMQ_HOST}   # Se estiver a correr o RabbitMQ localmente
    port: ${SPRING_RABBITMQ_PORT}           # Porta padrão do RabbitMQ
    username:  ${SPRING_RABBITMQ_USERNAME}   # Usuário padrão
    password: ${SPRING_RABBITMQ_PASSWORD}   # Password padrão

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,beans
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    filter: true
    display-request-duration: true

logging:
  level:
    root: INFO
    com.aneto: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate: WARN
  file:
    name: logs/app.log

url:
  front-end: ${URL_FRONT_END}

codes:
  admin: ${CODE_ADMIN}
  especialista: ${CODE_EXPERT}
